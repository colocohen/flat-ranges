[package]
name = "flat-ranges"
version = "0.1.0"
edition = "2021"
description = "Half-open interval tracking with have/notHave state - Rust port of flat-ranges (npm)"
license = "Apache-2.0"
authors = ["colocohen"]
repository = "https://github.com/colocohen/flat-ranges"

[lib]
name = "flat_ranges"
path = "src/lib.rs"
crate-type = ["rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
